<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2bcc2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>HSK 1 Study</title>
<style>
:root {
  --paper: #f2bcc2;
  --sheet: #fff7f8;
  --ink: #4a2a31;
  --muted: #8a6169;
  --blossom: #b4506a;
  --blossom-soft: #fbe3e7;
  --petal: #fde9ec;
  --petal-edge: #f4c3cb;
  --stamen: #e8a33c;
  --branch: #7a4a45;
  --seal: #b23a2e;
  --good: #3f7d5c;
  --bad: #b23a2e;
  --line: #efcfd5;
  --grid: #e79aa8;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #2b1a1f; --sheet: #38242a; --ink: #f7e6ea; --muted: #c49aa4;
    --blossom: #f2a3b6; --blossom-soft: #4a2e36; --petal: #f6d3da; --petal-edge: #d99aa8; --stamen: #e8b45c; --branch: #a37870;
    --seal: #ef7a6c; --good: #7cc79c; --bad: #ef7a6c; --line: #4d333a; --grid: #7a4752;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #2b1a1f; --sheet: #38242a; --ink: #f7e6ea; --muted: #c49aa4;
  --blossom: #f2a3b6; --blossom-soft: #4a2e36; --petal: #f6d3da; --petal-edge: #d99aa8; --stamen: #e8b45c; --branch: #a37870;
  --seal: #ef7a6c; --good: #7cc79c; --bad: #ef7a6c; --line: #4d333a; --grid: #7a4752;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.hz { font-family: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif; }
/* Handwriting style (楷体) where learners copy strokes */
.kai, .cell .ghost, .ex-row .zh, .radicals .zh, .rule .big { font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", "AR PL UKai CN", "AR PL KaitiM GB", "Songti SC", "Noto Serif SC", serif; }
main { max-width: 520px; margin: 0 auto; padding: 14px 16px 96px; }
button { font: inherit; color: inherit; -webkit-user-select: none; user-select: none; }
.pad-wrap, .card { -webkit-user-select: none; user-select: none; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--blossom); outline-offset: 2px; }
.hidden { display: none !important; }

/* Bottom navigation */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--sheet); border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
nav.tabs button { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 1px 12px; font-size: 11px; color: var(--muted); cursor: pointer; }
nav.tabs button .ic { display: block; font-size: 20px; line-height: 1.2; }
nav.tabs button.active { color: var(--blossom); font-weight: 600; }

h1 { font-size: 24px; margin: 6px 0 2px; font-weight: 700; }
h2 { font-size: 18px; margin: 18px 0 8px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.banner { background: var(--blossom-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }

/* Lesson list */
.lesson { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--sheet);
  border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
.lesson.next { border-color: var(--blossom); box-shadow: inset 4px 0 0 var(--blossom); }
.lesson .num { font-size: 20px; font-weight: 700; color: var(--muted); min-width: 26px; text-align: center; }
.lesson .t { flex: 1; min-width: 0; }
.lesson .t .zh { font-size: 19px; }
.lesson .t .en { font-size: 13px; color: var(--muted); }
.lesson .t .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.lesson .t .bar i { display: block; height: 100%; background: var(--blossom); }
.seal { width: 48px; height: 48px; flex: none; border: 2px solid var(--seal); color: var(--seal); border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-6deg);
  font-size: 11px; line-height: 1.1; }
.seal b { font-size: 17px; font-family: "Songti SC", "Noto Serif SC", serif; }
.seal.empty { border: 2px dashed var(--line); color: var(--muted); transform: none; }
/* Course parts */
details.part { margin: 0 0 10px; }
.part-head { list-style: none; display: flex; align-items: center; gap: 10px; background: var(--sheet); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 14px; cursor: pointer; box-shadow: 0 1px 2px rgba(122, 40, 60, .08); }
.part-head::-webkit-details-marker { display: none; }
.part-t { flex: 1; min-width: 0; }
.part-t .k { display: block; font-size: 12px; font-weight: 700; color: var(--blossom); letter-spacing: .05em; text-transform: uppercase; }
.part-t .nm { display: block; font-size: 18px; font-weight: 700; }
.part-t .pg { display: block; font-size: 13px; color: var(--muted); }
.chev { font-size: 26px; color: var(--muted); transition: transform .2s; }
details.part[open] .chev { transform: rotate(90deg); }
.part-body { padding: 8px 0 4px; }

/* Lesson detail steps (a real sequence, so numbered) */
.back { border: 0; background: none; color: var(--blossom); padding: 4px 0; cursor: pointer; font-size: 15px; }
.step { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--sheet);
  border: 1px solid var(--line); border-radius: 14px; padding: 14px 12px; margin-bottom: 8px; cursor: pointer; }
.step .n { width: 30px; height: 30px; border-radius: 50%; background: var(--blossom-soft); color: var(--blossom);
  display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
.step.done .n { background: var(--blossom); color: var(--sheet); }
.step .t { flex: 1; }
.step .t small { display: block; color: var(--muted); font-size: 13px; }
.step .score { font-weight: 700; color: var(--blossom); }

/* Question card */
.progress { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; margin: 8px 0; }
.track { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 12px; }
.track i { display: block; height: 100%; background: var(--blossom); transition: width .2s; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; padding: 22px 16px;
  text-align: center; min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.big-hz { font-size: 84px; line-height: 1.15; }
.big-py { font-size: 34px; color: var(--blossom); font-weight: 600; }
.mid-py { font-size: 22px; color: var(--blossom); margin-top: 6px; }
.en { font-size: 19px; margin-top: 8px; }
.note { font-size: 13px; color: var(--muted); margin-top: 10px; }
.tag { display: inline-block; font-size: 11px; color: var(--seal); border: 1px solid var(--seal); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
.listen { margin-top: 14px; padding: 9px 18px; border-radius: 22px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-size: 15px; }
.listen.large { font-size: 18px; padding: 14px 26px; }
.listen-pair { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.opt { padding: 14px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-size: 16px; min-height: 56px; }
.opt.hzopt { font-size: 30px; }
.opt.pyopt { font-size: 20px; color: var(--blossom); }
.opt.right { background: var(--good); border-color: var(--good); color: #fff; }
.opt.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
.feedback { min-height: 24px; text-align: center; margin-top: 10px; font-size: 15px; }
.row { display: flex; gap: 8px; margin-top: 12px; }
.btn { flex: 1; padding: 14px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-size: 16px; }
.btn.primary { background: var(--blossom); border-color: var(--blossom); color: #fff; }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 13px; cursor: pointer; display: block; margin: 18px auto 0; }

/* Writing grid (tian zi ge) */
.pad-wrap { position: relative; margin: 12px auto 0; touch-action: none; }
.cells { display: flex; }
.cell { position: relative; border: 2px solid var(--grid); background: var(--sheet); }
.cell + .cell { border-left: 0; }
.cell::before, .cell::after { content: ""; position: absolute; border-color: var(--grid); border-style: dashed; }
.cell::before { left: 50%; top: 0; bottom: 0; border-width: 0 0 0 1px; }
.cell::after { top: 50%; left: 0; right: 0; border-width: 1px 0 0 0; }
.cell .ghost { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--seal); opacity: .35; pointer-events: none; z-index: 1; }
.pad-wrap canvas { position: absolute; inset: 0; z-index: 2; }
.small-row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
.small-row .btn { flex: none; padding: 9px 16px; font-size: 14px; }

/* Word list */
select { width: 100%; padding: 11px; font-size: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); margin-bottom: 12px; }
.word { display: flex; align-items: center; gap: 12px; padding: 11px 12px; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 6px; }
.word .h { font-size: 26px; min-width: 64px; }
.word .m { flex: 1; min-width: 0; }
.word .m .p { color: var(--blossom); }
.word .m .e { font-size: 14px; color: var(--muted); }
.word button { border: 0; background: none; font-size: 20px; cursor: pointer; padding: 6px; }

/* Segmented control */
.seg { display: flex; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px 4px; border-radius: 9px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--blossom); color: #fff; }

/* Tones */
.tone-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.tone-row button { padding: 10px 2px; border-radius: 12px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; }
.tone-row button .zh { display: block; font-size: 26px; }
.tone-row button .py { display: block; color: var(--blossom); font-size: 16px; }
.summary-row { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); }

/* Cherry blossom decoration */
main, nav.tabs { position: relative; z-index: 1; }
nav.tabs { position: fixed; }
.blossoms { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.blossoms svg.corner { position: absolute; width: min(46vw, 260px); height: auto; opacity: .75; }
.blossoms .tr { top: 0; right: 0; }
.blossoms .bl { bottom: 56px; left: 0; transform: rotate(180deg); }
.fl-petal { fill: var(--petal); stroke: var(--petal-edge); stroke-width: 1; }
.fl-mid { fill: var(--stamen); }
.fl-branch { stroke: var(--branch); stroke-width: 5; stroke-linecap: round; fill: none; }
.fall { position: absolute; top: -20px; width: 14px; height: 10px; background: var(--petal); border-radius: 80% 10% 80% 10%;
  opacity: .85; animation: fall linear infinite; }
@keyframes fall {
  0% { transform: translate(0, -20px) rotate(0deg); }
  100% { transform: translate(-60px, 105vh) rotate(540deg); }
}
.btn.primary { box-shadow: 0 2px 0 rgba(122, 40, 60, .18); }
.card, .lesson, .step, .word { box-shadow: 0 1px 2px rgba(122, 40, 60, .08); }

/* Basics tab: pinyin chart, numbers, time, characters */
.chart { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.chart.wide { grid-template-columns: repeat(3, 1fr); }
.chart button { padding: 8px 2px; border-radius: 12px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; }
.chart button .py { display: block; font-size: 20px; font-weight: 700; color: var(--blossom); }
.chart button .ex { display: block; font-size: 13px; color: var(--muted); }
.chart button.on { border-color: var(--blossom); box-shadow: inset 0 0 0 1px var(--blossom); }
.tipbox { position: sticky; top: 6px; z-index: 2; background: var(--blossom-soft); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; font-size: 14px; min-height: 44px; margin: 8px 0; }
.tipbox b { color: var(--blossom); font-size: 17px; }
.num-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.num-grid button { padding: 8px 2px; border-radius: 12px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; }
.num-grid .d { display: block; font-size: 13px; color: var(--muted); }
.num-grid .zh { display: block; font-size: 26px; }
.num-grid .py { display: block; font-size: 13px; color: var(--blossom); }
.rule { display: flex; gap: 10px; align-items: center; padding: 9px 12px; background: var(--sheet); border: 1px solid var(--line);
  border-radius: 12px; margin-bottom: 6px; width: 100%; text-align: left; cursor: pointer; }
.rule .d { min-width: 54px; font-weight: 700; color: var(--muted); }
.rule .zh { font-size: 20px; }
.rule .big { font-size: 34px; min-width: 54px; text-align: center; }
.rule .py { font-size: 13px; color: var(--blossom); }
.rule .m { flex: 1; min-width: 0; }
.try { display: flex; gap: 8px; align-items: center; }
.try input { flex: 1; min-width: 0; padding: 11px; font-size: 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); }
.try-out { text-align: center; margin: 10px 0 4px; min-height: 64px; }
.try-out .zh { font-size: 30px; }
.try-out .py { color: var(--blossom); }
.clock { width: 150px; height: 150px; }
.clock .face { fill: var(--sheet); stroke: var(--blossom); stroke-width: 3; }
.clock .tick { stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
.clock .hh { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; }
.clock .mh { stroke: var(--blossom); stroke-width: 3; stroke-linecap: round; }
.clock .hub { fill: var(--seal); }
.digital { font-size: 22px; font-weight: 700; color: var(--muted); margin-top: 4px; }
.opt.zhopt { font-size: 20px; }
.seg.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.verb-head { display: flex; align-items: baseline; gap: 10px; }
.verb-head .zh { font-size: 40px; }
.verb-head .py { font-size: 20px; color: var(--blossom); font-weight: 600; }
.verb-head .en { font-size: 16px; margin: 0; }
.pattern { font-size: 14px; background: var(--blossom-soft); border-radius: 10px; padding: 6px 10px; margin: 6px 0; }
.sent { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 8px 2px; cursor: pointer; }
.sent .zh { font-size: 19px; }
.sent .py { font-size: 13px; color: var(--blossom); }
.sent .e { font-size: 13px; color: var(--muted); }
.sent .neg { color: var(--seal); font-size: 11px; border: 1px solid var(--seal); border-radius: 6px; padding: 0 5px; margin-left: 6px; vertical-align: middle; }
.cheat { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
.cheat h3 { margin: 0 0 6px; font-size: 16px; color: var(--blossom); }
.cheat table { width: 100%; border-collapse: collapse; font-size: 14px; }
.cheat td { padding: 5px 4px; border-top: 1px solid var(--line); vertical-align: top; cursor: pointer; }
.cheat tr:first-child td { border-top: 0; }
.cheat td.zh { font-size: 18px; white-space: nowrap; }
.cheat td.py { color: var(--blossom); white-space: nowrap; }
.cheat td.e { color: var(--muted); }
.formula { font-size: 15px; text-align: center; padding: 8px; background: var(--blossom-soft); border-radius: 10px; margin-bottom: 6px; }
.seg.grid3 button:last-child { grid-column: span 3; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 2px; }
.chips span { font-size: 13px; background: var(--blossom-soft); border-radius: 8px; padding: 2px 8px; }
.type-card { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.type-card h3 { margin: 0; font-size: 17px; }
.type-card h3 .hz { color: var(--blossom); margin-left: 6px; font-weight: 400; }
.type-card p { margin: 4px 0 8px; font-size: 14px; color: var(--muted); }
.ex-row { display: flex; flex-wrap: wrap; gap: 6px; }
.ex-row button { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 6px 10px; cursor: pointer; text-align: center; }
.ex-row .zh { display: block; font-size: 26px; }
.ex-row .e { display: block; font-size: 12px; color: var(--muted); }
.radicals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.radicals div { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; }
.radicals .zh { font-size: 28px; display: block; color: var(--blossom); }
.radicals .e { font-size: 13px; display: block; }
.radicals .x { font-size: 13px; display: block; color: var(--muted); }

/* Sentence builder */
.seg.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
.seg.grid4 button { font-size: 13px; padding: 9px 2px; }
.build-line { min-height: 74px; background: var(--sheet); border: 2px dashed var(--grid); border-radius: 14px; padding: 8px;
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.build-line .empty { color: var(--muted); font-size: 14px; width: 100%; text-align: center; }
.tile { border: 1px solid var(--line); background: var(--sheet); border-radius: 10px; padding: 5px 9px; cursor: pointer; text-align: center; min-width: 44px; }
.tile .zh { display: block; font-size: 22px; line-height: 1.2; }
.tile .py { display: block; font-size: 11px; color: var(--blossom); }
.build-line .tile { background: var(--blossom-soft); border-color: var(--blossom); }
.tile.used { opacity: .35; }
.bank { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
.cat-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-top: 10px; -webkit-overflow-scrolling: touch; }
.cat-row button { flex: none; border: 1px solid var(--line); background: var(--sheet); border-radius: 18px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.cat-row button.on { background: var(--blossom); border-color: var(--blossom); color: #fff; }
.verdict { border-radius: 14px; padding: 12px; margin-top: 10px; font-size: 15px; border: 1px solid var(--line); background: var(--sheet); }
.verdict h3 { margin: 0 0 6px; font-size: 17px; }
.verdict.good h3 { color: var(--good); }
.verdict.bad h3 { color: var(--bad); }
.verdict.warn h3 { color: var(--stamen); }
.issue { padding: 8px 0; border-top: 1px solid var(--line); }
.issue:first-of-type { border-top: 0; }
.issue .lvl { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; margin-right: 6px; color: #fff; }
.issue .lvl.error { background: var(--bad); }
.issue .lvl.warn { background: var(--stamen); }
.issue .lvl.info { background: var(--muted); }
.issue .fix { margin-top: 4px; font-size: 14px; }
.issue .fix .hz { font-size: 18px; }
.gloss { font-size: 13px; color: var(--muted); margin-top: 6px; }
.prompt-en { font-size: 20px; font-weight: 600; }

.sent-row { display: flex; align-items: center; gap: 4px; }
.sent-row .sent { flex: 1; }
.py-tap { color: var(--muted) !important; font-size: 13px !important; font-weight: 400 !important; text-decoration: underline dotted; cursor: pointer; }
.who { font-size: 12px; font-weight: 700; color: var(--blossom); margin-top: 8px; }
.pair { display: flex; gap: 6px; flex-wrap: wrap; }
.pair-item { flex: 1; min-width: 90px; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 8px 6px; cursor: pointer; text-align: center; }
.pair-item .zh { display: block; font-size: 24px; }
.pair-item .py { display: block; color: var(--blossom); font-size: 14px; }
.pair-item .e { display: block; font-size: 12px; color: var(--muted); }
.bubble { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 10px 12px; margin: 8px 40px 0 0; }
.bubble.mine { background: var(--blossom-soft); border-radius: 14px 14px 4px 14px; margin: 8px 0 0 40px; }
.bubble .hz { font-size: 18px; }

const STEPS = [
  { key: "learn", name: "Listen and learn", hint: "Hear each word with its pinyin and meaning" },
  { key: "sounds", name: "Sounds and tones", hint: "Hear a word, choose the right pinyin" },
  { key: "chars", name: "Characters", hint: "See a character, choose its meaning" },
  { key: "write", name: "Writing", hint: "Write the most common characters from memory" },
  { key: "listen", name: "Listening", hint: "Hear a word, choose its character" }
];
const SCORED = ["sounds", "chars", "write", "listen"];
const PASS = 70;

function lessonScore(n) {
  const st = lstat(n).steps;
  const done = SCORED.filter(function (k) { return st[k] != null; });
  if (done.length < SCORED.length) return null;
  return Math.round(done.reduce(function (a, k) { return a + st[k]; }, 0) / done.length);
}
function lessonProgress(n) {
  const st = lstat(n).steps;
  return STEPS.filter(function (s) { return st[s.key] != null; }).length / STEPS.length;
}
function nextLesson() {
  for (let i = 0; i < LESSONS.length; i++) {
    const sc = lessonScore(LESSONS[i].n);
    if (sc == null || sc < PASS) return LESSONS[i].n;
  }
  return null;
}

// ---------- Lessons home ----------
let currentTab = "lessons";
function renderLessons() {
  clear();
  app.appendChild(el("h1", { text: "HSK 1 Study" }));
  app.appendChild(el("p", { class: "sub", text: "Work through each lesson in order. Sounds come first, then characters. Each test brings back words you found hard earlier." }));
  const vb = voiceBanner(); if (vb) app.appendChild(vb);
  const nx = nextLesson();
  app.appendChild(welcomeCard(nx));
  // Part 0: background and facts, before Lesson 1
  (function () {
    const started = hasStarted();
    const saved = S.last.parts && S.last.parts.intro;
    const box = el("details", { class: "part" }, [
      el("summary", { class: "part-head" }, [
        el("span", { class: "part-t" }, [
          el("span", { class: "k", text: "Part 0" }),
          el("span", { class: "nm", text: "Before you start" }),
          el("span", { class: "pg", text: "Where Mandarin comes from, and why it works the way it does. " + INTRO.filter(function (t, i) { return introRead(i); }).length + " of " + INTRO.length + " read." })
        ]),
        el("span", { class: "chev", "aria-hidden": "true", text: "›" })
      ])
    ]);
    const body = el("div", { class: "part-body" });
    INTRO.forEach(function (t, i) { body.appendChild(introRow(i)); });
    box.appendChild(body);
    if (saved != null ? saved : !started) box.open = true;
    box.addEventListener("toggle", function () { S.last.parts = S.last.parts || {}; S.last.parts.intro = box.open; save(true); });
    app.appendChild(box);
  })();
  COURSE.forEach(function (part, pi) {
    const ls = LESSONS.filter(part.has);
    const passedHere = ls.filter(function (L) { const sc = lessonScore(L.n); return sc != null && sc >= PASS; }).length;
    const open = S.last.parts && S.last.parts[pi] != null ? S.last.parts[pi] : ls.some(function (L) { return L.n === nx; }) || (!nx && pi === 0);
    const body = el("div", { class: "part-body" });
    const box = el("details", { class: "part" }, [
      el("summary", { class: "part-head" }, [
        el("span", { class: "part-t" }, [
          el("span", { class: "k", text: "Part " + (pi + 1) }),
          el("span", { class: "nm" }, [part.name]),
          el("span", { class: "pg", text: part.about + " " + passedHere + " of " + ls.length + " passed." })
        ]),
        el("span", { class: "chev", "aria-hidden": "true", text: "›" })
      ]),
      body
    ]);
    if (open) box.open = true;
    box.addEventListener("toggle", function () { S.last.parts = S.last.parts || {}; S.last.parts[pi] = box.open; save(true); });
    ls.forEach(function (L) { body.appendChild(lessonRow(L, nx)); });
    const best = (S.partTests || {})[pi];
    body.appendChild(el("button", { class: "step", onclick: function () { startPartTest(pi); } }, [
      el("span", { class: "n", text: "📝" }),
      el("span", { class: "t" }, ["Part " + (pi + 1) + " test", el("small", { text: "20 mixed questions from all " + ls.length + " lessons" })]),
      best != null ? el("span", { class: "score", text: "Best " + best + "%" }) : null
    ]));
    app.appendChild(box);
  });
}
// The course in three parts
const COURSE = [
  { name: "First steps", about: "Greetings, family, numbers, time and daily life.", has: function (L) { return L.n <= 15; } },
  { name: "Everyday words", about: "Food, people, places, time, school and work.", has: function (L) { return L.isExtra; } },
  { name: "Song: 一想到你", about: "The words of Interesting by 音阙诗听 ft. 赵方婧, starting with ones you know.", has: function (L) { return L.isSong; } }
];
function lessonRow(L, nx) {
    const sc = lessonScore(L.n);
    const prog = lessonProgress(L.n);
    let seal;
    if (sc != null && sc >= PASS) seal = el("div", { class: "seal", "aria-label": "Passed with " + sc + "%" }, [el("b", { text: "过" }), sc + "%"]);
    else if (sc != null) seal = el("div", { class: "seal empty", text: sc + "%" });
    else seal = el("div", { class: "seal empty", text: prog ? Math.round(prog * 100) + "%" : "" });
    return el("button", { class: "lesson" + (L.n === nx ? " next" : ""), onclick: function () { renderLesson(L.n); } }, [
      el("span", { class: "num", text: L.isSong ? "♪" + (L.n - SONG.n + 1) : String(L.n) }),
      el("span", { class: "t" }, [
        el("div", { class: "zh hz", text: L.zh }),
        el("div", { class: "en", text: L.en + (L.n === nx ? ". Up next" : "") }),
        el("div", { class: "bar" }, [el("i", { style: "width:" + Math.round(prog * 100) + "%" })])
      ]),
      seal
    ]);
}
function savedWhen() {
  if (!S.savedAt) return "not yet";
  const d = new Date(S.savedAt), now = new Date();
  const time = (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" + (d.getMinutes() < 10 ? "0" : "") + d.getMinutes();
  if (dayKey(d) === dayKey(now)) return "today at " + time;
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (dayKey(d) === dayKey(y)) return "yesterday at " + time;
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "long" }) + " at " + time;
}
// A word counts as learned once it has been answered right 3 times in a row
function wordsKnown() { return Object.keys(ALL_KEYS).filter(function (k) { return (S.words[k] || {}).box >= 3; }).length; }
// True once any word has been answered or any lesson step done
// (empty lesson records are created just by looking at scores)
function hasStarted() {
  return Object.keys(S.words).length > 0 || Object.keys(S.lessons).some(function (k) { return Object.keys(S.lessons[k].steps || {}).length; });
}
function welcomeCard(nx) {
  const started = hasStarted();
  if (!started) {
    return el("div", { class: "banner", text: "New to Chinese? Start with Part 0 below for a quick background, then Lesson 1. Your progress saves automatically, so you can stop at any time." });
  }
  const passed = LESSONS.filter(function (L) { const sc = lessonScore(L.n); return sc != null && sc >= PASS; }).length;
  const st = streak();
  const goTo = S.last.lesson || nx || 1;
  const box = el("div", { class: "type-card", style: "margin-bottom:14px" }, [
    el("h3", { text: "Welcome back" }),
    el("p", { style: "margin:4px 0 6px", text: "Progress saved " + savedWhen() + "." }),
    el("div", { class: "chips" }, [
      el("span", { text: "🔥 " + st + (st === 1 ? " day" : " days") + " in a row" }),
      el("span", { text: wordsKnown() + " of " + Object.keys(ALL_KEYS).length + " words learned" }),
      el("span", { text: passed + " lessons passed" })
    ]),
    GUIDE[goTo] ? el("p", { style: "margin:10px 0 0", text: "Next up in " + lessonLabel(goTo) + ": " + GUIDE[goTo].goal.replace(/^./, function (c) { return c.toLowerCase(); }) }) : null,
    el("div", { class: "row" }, [el("button", { class: "btn primary", text: "Continue: " + lessonLabel(goTo), onclick: function () { renderLesson(goTo); } })])
  ]);
  if (!saveWorks) box.appendChild(el("div", { class: "banner", style: "margin:10px 0 0", text: "This browser is blocking saving, so progress may be lost when you close it. Open the app in Safari or Chrome, not a private window." }));
  return box;
}
// ---------- One lesson ----------
function renderLesson(n) {
  clear();
  S.last.lesson = n; save(true);
  const L = LESSONS[n - 1];
  const st = lstat(n).steps;
  app.appendChild(el("button", { class: "back", text: "‹ All lessons", onclick: renderLessons }));
  app.appendChild(el("h1", { class: "hz", text: L.zh }));
  const covers = n > 1 ? ". Tests also review words from earlier lessons" : "";
  app.appendChild(el("p", { class: "sub", text: L.label + ": " + L.en + ". " + L.w.length + " words" + covers + "." }));
  if (GUIDE[n] && GUIDE[n].goal) app.appendChild(el("div", { class: "banner" }, [el("b", { text: "🎯 Goal: " }), GUIDE[n].goal]));
  if (TRACE_PAGES[n]) app.appendChild(traceLink(n, "📄 Tracing sheet for this lesson (PDF)"));
  if (hasGuide(n)) {
    const bits = [GUIDE[n] && GUIDE[n].dlg ? "dialogue" : null, NOTES[n] && NOTES[n].g ? "grammar" : null, GUIDE[n] && GUIDE[n].watch ? "watch out" : null, "culture"].filter(Boolean);
    app.appendChild(el("button", { class: "step", onclick: function () { renderNotes(n); } }, [
      el("span", { class: "n", text: "📖" }),
      el("span", { class: "t" }, ["Lesson guide", el("small", { text: bits.join(", ").replace(/^./, function (c) { return c.toUpperCase(); }) })])
    ]));
  }
  STEPS.forEach(function (s, i) {
    const done = st[s.key] != null;
    const score = done && s.key !== "learn" ? el("span", { class: "score", text: st[s.key] + "%" }) : (done ? el("span", { class: "score", text: "Done" }) : null);
    app.appendChild(el("button", { class: "step" + (done ? " done" : ""), onclick: function () { startStep(n, s.key); } }, [
      el("span", { class: "n", text: String(i + 1) }),
      el("span", { class: "t" }, [s.name, el("small", { text: s.hint })]),
      score
    ]));
  });
  const sc = lessonScore(n);
  if (sc != null) {
    const passed = sc >= PASS;
    app.appendChild(el("p", { class: "sub", style: "margin-top:12px", text: passed
      ? "Lesson score " + sc + "%. Passed. You're ready for the next lesson."
      : "Lesson score " + sc + "%. Aim for " + PASS + "% before moving on. Repeat the steps with the lowest scores." }));
    if (passed && n < LESSONS.length) app.appendChild(el("div", { class: "row" }, [el("button", { class: "btn primary", text: "Go to " + lessonLabel(n + 1), onclick: function () { renderLesson(n + 1); } })]));
    if (passed) app.appendChild(el("p", { class: "note", style: "text-align:center;margin-top:14px" }, [
      S.hidePy !== false ? "Pinyin is now hidden in this lesson, so you practise reading. Tap it to peek. " : "Pinyin is shown in every lesson. ",
      el("button", { class: "linkbtn", style: "display:inline;margin:0", text: S.hidePy !== false ? "Always show pinyin" : "Hide pinyin in passed lessons",
        onclick: function () { S.hidePy = S.hidePy === false; save(true); renderLesson(n); } })
    ]));
  }
}

function finishStep(n, key, pct) {
  lstat(n).steps[key] = pct;
  noteStudyDay();
  save();
}

function header(n, key, i, total) {
  const s = STEPS.find(function (x) { return x.key === key; });
  app.appendChild(el("button", { class: "back", text: "‹ " + lessonLabel(n), onclick: function () { window.speechSynthesis && speechSynthesis.cancel(); renderLesson(n); } }));
  app.appendChild(el("div", { class: "progress" }, [el("span", { text: s.name }), el("span", { text: (i + 1) + " of " + total })]));
  app.appendChild(el("div", { class: "track" }, [el("i", { style: "width:" + Math.round(100 * i / total) + "%" })]));
}

function startStep(n, key) {
  if (key === "learn") return runLearn(n, 0);
  let qs;
  if (key === "sounds") qs = pickQuestions(n, 12, 4, function () { return true; });
  if (key === "chars") qs = pickQuestions(n, 12, 4, function () { return true; });
  if (key === "write") {
    // Core words only: one or two characters, all of them common
    let f = function (w) { return !w.name && w.h.length <= 2 && w.h.split("").every(function (c) { return CORE_CHARS[c]; }); };
    if (lessonWords(n).filter(f).length < 3) f = function (w) { return !w.name && w.h.length === 1; };
    const fresh = lessonWords(n).filter(f).length;
    qs = pickQuestions(n, fresh ? 6 : 0, fresh ? 2 : 6, f);
  }
  if (key === "listen") qs = pickQuestions(n, 12, 4, function () { return true; });
  runQuiz(n, key, qs, 0, 0);
}

// ---------- Pinyin hidden in passed lessons, so you practise reading ----------
function hidePinyin(n) { const sc = lessonScore(n); return S.hidePy !== false && sc != null && sc >= PASS; }
// Pinyin that stays hidden until tapped
function pinyinTap(text, cls) {
  const e = el("div", { class: cls + " py-tap", role: "button", tabindex: "0", text: "Tap to show pinyin" });
  e.addEventListener("click", function (ev) { ev.stopPropagation(); e.textContent = text; e.classList.remove("py-tap"); });
  return e;
}

// ---------- Step 1: listen and learn ----------
function runLearn(n, i) {
  const ws = lessonWords(n);
  clear();
  header(n, "learn", i, ws.length);
  const w = ws[i];
  const hide = hidePinyin(n);
  // Before a lesson is passed: sound first. After: read the character first.
  app.appendChild(el("div", { class: "card" }, hide ? [
    el("div", { class: "hz", style: "font-size:64px", text: w.h }),
    el("div", { class: "en", text: w.e }),
    pinyinTap(w.p, "big-py"),
    listenBtn(w.h, true)
  ] : [
    el("div", { class: "big-py", text: w.p }),
    el("div", { class: "en", text: w.e }),
    el("div", { class: "hz", style: "font-size:56px;margin-top:10px", text: w.h }),
    listenBtn(w.h, true)
  ]));
  const ex = sentenceFor(w);
  if (ex) app.appendChild(el("div", { class: "type-card", style: "margin-top:10px" }, [el("div", { class: "note", style: "margin:0 0 4px", text: "In a sentence" }), sentenceBlock(ex, hide)]));
  app.appendChild(el("p", { class: "note", style: "text-align:center", text: "Say the word out loud after you hear it." }));
  const last = i === ws.length - 1;
  app.appendChild(el("div", { class: "row" }, [
    el("button", { class: "btn", text: "Back", disabled: i === 0 ? "disabled" : null, onclick: function () { runLearn(n, i - 1); } }),
    el("button", { class: "btn primary", text: last ? "Finish" : "Next word", onclick: function () {
      if (last) { finishStep(n, "learn", 100); renderLesson(n); } else runLearn(n, i + 1);
    } })
  ]));
  if (i === 0) { /* do not autoplay the very first word: phones need a tap before speech */ } else speak(w.h);
}
// ---------- Quiz steps ----------
function runQuiz(n, key, qs, i, right) {
  if (i >= qs.length) return quizDone(n, key, right, qs.length);
  clear();
  header(n, key, i, qs.length);
  const w = qs[i];
  const isReview = w.lesson < n;
  const reviewNote = isReview ? el("div", { class: "note", text: "Review from " + lessonLabel(w.lesson).toLowerCase() }) : null;

  function next(ok) { runQuiz(n, key, qs, i + 1, right + (ok ? 1 : 0)); }

  if (key === "write") return writeQuestion(n, w, reviewNote, next);

  let prompt, options, label, isAnswer;
  if (key === "sounds") {
    prompt = el("div", { class: "card" }, [
      el("div", { class: "en", style: "margin-top:0", text: w.e }),
      listenBtn(w.h, true), reviewNote,
      el("div", { class: "note", text: "Which pinyin did you hear? Watch the tone marks." }),
      Object.keys(spokenForms(w)).length && /ǎ|ě|ǐ|ǒ|ǔ|ǚ/.test(w.p) && /一|不/.test(w.h) === false
        ? el("div", { class: "note", text: "Tip: two 3rd tones together, so the first is said as a 2nd tone." }) : null
    ]);
    const spoken = spokenForms(w);
    const opts = [w.p].concat(toneVariants(w.p, 3, spoken));
    options = shuffle(opts);
    label = function (o) { return el("button", { class: "opt pyopt" }, [o]); };
    isAnswer = function (o) { return o === w.p; };
    speak(w.h);
  }
  if (key === "chars") {
    prompt = el("div", { class: "card" }, [el("div", { class: "big-hz hz", text: w.h }), reviewNote,
      el("div", { class: "note", text: "What does this mean?" })]);
    options = shuffle([w].concat(distractors(w, 3, "meaning")));
    label = function (o) { return el("button", { class: "opt" }, [o.e]); };
    isAnswer = function (o) { return o.id === w.id; };
  }
  if (key === "listen") {
    prompt = el("div", { class: "card" }, [listenBtn(w.h, true), reviewNote,
      el("div", { class: "note", text: "Choose the character you heard." })]);
    options = shuffle([w].concat(distractors(w, 3, "sound")));
    label = function (o) { return el("button", { class: "opt hzopt hz" }, [o.h]); };
    isAnswer = function (o) { return o.id === w.id; };
    speak(w.h);
  }

  app.appendChild(prompt);
  const grid = el("div", { class: "opts" });
  const fb = el("div", { class: "feedback", role: "status" });
  const nextBtn = el("button", { class: "btn primary", text: "Next", disabled: "disabled" });
  let answered = false, wasRight = false;
  const buttons = options.map(function (o) {
    const b = label(o);
    b.addEventListener("click", function () {
      if (answered) return;
      answered = true;
      wasRight = isAnswer(o);
      mark(w, wasRight);
      buttons.forEach(function (bb, k) { if (isAnswer(options[k])) bb.classList.add("right"); });
      if (!wasRight) b.classList.add("wrong");
      fb.textContent = (wasRight ? "Correct. " : "Not quite. ") + w.h + "  " + w.p + "  " + w.e;
      fb.style.color = wasRight ? "var(--good)" : "var(--bad)";
      nextBtn.disabled = false;
      if (key !== "sounds") speak(w.h);
    });
    grid.appendChild(b);
    return b;
  });
  nextBtn.addEventListener("click", function () { next(wasRight); });
  app.appendChild(grid);
  app.appendChild(fb);
  app.appendChild(el("div", { class: "row" }, [nextBtn]));
}

function quizDone(n, key, right, total) {
  const pct = total ? Math.round(100 * right / total) : 0;
  finishStep(n, key, pct);
  clear();
  const s = STEPS.find(function (x) { return x.key === key; });
  app.appendChild(el("button", { class: "back", text: "‹ " + lessonLabel(n), onclick: function () { renderLesson(n); } }));
  app.appendChild(el("h1", { text: s.name + ": " + pct + "%" }));
  app.appendChild(el("p", { class: "sub", text: right + " of " + total + " correct. " +
    (pct >= PASS ? "Well done." : "Words you missed will come back in later tests and in Review.") }));
  const idx = STEPS.findIndex(function (x) { return x.key === key; });
  const after = STEPS[idx + 1];
  app.appendChild(el("div", { class: "row" }, [
    el("button", { class: "btn", text: "Try again", onclick: function () { startStep(n, key); } }),
    after ? el("button", { class: "btn primary", text: "Next: " + after.name, onclick: function () { startStep(n, after.key); } })
          : el("button", { class: "btn primary", text: "See lesson result", onclick: function () { renderLesson(n); } })
  ]));
}

// ---------- Writing question (tian zi ge grid, self-checked) ----------
function writeQuestion(n, w, reviewNote, next) {
  app.appendChild(el("div", { class: "card", style: "min-height:0;padding:14px" }, [
    el("div", { class: "en", style: "margin-top:0", text: w.e }),
    el("div", { class: "mid-py", text: w.p }), reviewNote,
    el("div", { class: "note", text: "Write it in the grid, then check yourself." })
  ]));
  const chars = w.h.split("");
  const avail = Math.min((app.clientWidth || 360) - 32, 488);
  const size = Math.floor(Math.min(220, avail / chars.length));
  const wrap = el("div", { class: "pad-wrap", style: "width:" + (size * chars.length) + "px" });
  const cells = el("div", { class: "cells" });
  const ghosts = [];
  chars.forEach(function (c) {
    const g = el("div", { class: "ghost hz hidden", style: "font-size:" + Math.floor(size * 0.8) + "px", text: c });
    ghosts.push(g);
    cells.appendChild(el("div", { class: "cell", style: "width:" + size + "px;height:" + size + "px" }, [g]));
  });
  const cv = el("canvas", { "aria-label": "Writing area" });
  wrap.appendChild(cells); wrap.appendChild(cv);
  app.appendChild(wrap);
  setupCanvas(cv, size * chars.length, size);

  const fb = el("div", { class: "feedback", role: "status" });
  const toggle = el("button", { class: "btn", text: "Show answer" });
  toggle.addEventListener("click", function () {
    const hidden = ghosts[0].classList.contains("hidden");
    ghosts.forEach(function (g) { g.classList.toggle("hidden", !hidden); });
    toggle.textContent = hidden ? "Hide answer" : "Show answer";
  });
  app.appendChild(el("div", { class: "small-row" }, [
    el("button", { class: "btn", text: "Clear", onclick: function () { cv.getContext("2d").clearRect(0, 0, cv.width, cv.height); } }),
    toggle,
    listenBtn(w.h)
  ]));
  app.appendChild(fb);
  const choice = el("div", { class: "row" });
  function decide(ok) {
    mark(w, ok);
    ghosts.forEach(function (g) { g.classList.remove("hidden"); });
    fb.textContent = (ok ? "Marked correct. " : "Marked missed. ") + w.h + "  " + w.p;
    fb.style.color = ok ? "var(--good)" : "var(--bad)";
    choice.innerHTML = "";
    choice.appendChild(el("button", { class: "btn primary", text: "Next", onclick: function () { next(ok); } }));
  }
  choice.appendChild(el("button", { class: "btn bad", text: "I missed it", onclick: function () { decide(false); } }));
  choice.appendChild(el("button", { class: "btn good", text: "I got it", onclick: function () { decide(true); } }));
  app.appendChild(choice);
}

function setupCanvas(cv, w, h) {
  const dpr = window.devicePixelRatio || 1;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.width = w + "px"; cv.style.height = h + "px";
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.lineWidth = Math.max(5, h / 28);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = getComputedStyle(document.body).color;
  let down = false;
  function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

let dateScore = { right: 0, total: 0 };
// Show a date in English, choose it in Chinese
function dateQuestion(host) {
  host.innerHTML = "";

  const m = 1 + Math.floor(Math.random() * 12), dd = 1 + Math.floor(Math.random() * 28);

  const d = new Date(y, m - 1, dd);
  const answer = zhOf(m, dd);
  host.appendChild(el("div", { class: "card", style: "min-height:0;padding:16px" }, [
    el("div", { class: "big-py", style: "font-size:26px", text: d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }) }),
    el("div", { class: "note", text: "Which is this date in Chinese?" })
  ]));
  const cands = [[m % 12 + 1, dd], [m, dd % 28 + 1], [(m + 10) % 12 + 1, dd], [m, (dd + 6) % 28 + 1], [m, (dd + 13) % 28 + 1]];
  // One wrong answer has the right date but the wrong weekday
  const opts = [answer, zhNumber(m) + "月" + zhNumber(dd) + "号，" + WEEKDAYS[(d.getDay() + 1 + Math.floor(Math.random() * 5)) % 7]];
  shuffle(cands).forEach(function (c) { const t = zhOf(c[0], c[1]); if (opts.length < 4 && opts.indexOf(t) === -1) opts.push(t); });
  const order = shuffle(opts);
  const grid = el("div", { class: "opts", style: "grid-template-columns:1fr" });
  const fb = el("div", { class: "feedback", role: "status" });
  let done = false;
  order.forEach(function (o) {
    const b = el("button", { class: "opt zhopt hz", text: o });
    b.addEventListener("click", function () {
      if (done) return; done = true;
      dateScore.total++; const ok = o === answer; if (ok) dateScore.right++;
      grid.children[order.indexOf(answer)].classList.add("right");
      if (!ok) b.classList.add("wrong");
      fb.textContent = (ok ? "Correct. " : "Not quite. ") + answer + ". Score " + dateScore.right + " of " + dateScore.total;
      fb.style.color = ok ? "var(--good)" : "var(--bad)";

function tok(z) { return LEX[z]; }
// The learner's own name, as a People tile, so they can say 我叫…
function registerMyName() {

// Measure word that goes with a noun
function measureFor(t) {
  return { book: "本", drink: "杯", animal: "只", clothes: "件", money: "块" }[t.s] || "个";
}
const MEASURE_NOTE = { "本": "books", "杯": "drinks", "只": "animals", "件": "clothes", "块": "money", "口": "family members (with 人)" };

// Check a sentence. Returns a list of { lvl: error | warn | info, msg, fix }
// where fix is a corrected list of words when one can be suggested.
function checkSentence(toks) {
  const out = [];
  const n = toks.length;
  const Z = toks.map(function (t) { return t.zh; });
  function add(lvl, msg, fix) { out.push({ lvl: lvl, msg: msg, fix: fix || null }); }
  function T(i) { return toks[i] ? toks[i].t : ""; }
  function edit(fn) { const c = Z.slice(); fn(c); return c.map(tok); }
  function numLike(i) { return T(i) === "NUM" || Z[i] === "几"; }
  const ADV_STOP = ["很", "太", "真", "非常", "不", "也", "都"];
  if (!n) return out;
  if (n === 1) { add("error", "A sentence needs at least two words: usually who or what, then a verb or describing word."); return out; }

  // Taps that doubled up
  for (let i = 0; i < n - 1; i++) {
    if (Z[i] === Z[i + 1] && T(i) !== "V" && T(i) !== "NUM") add("warn", Z[i] + " appears twice in a row. Did you mean to tap it once?", edit(function (c) { c.splice(i, 1); }));
  }

  // End particles
  ["吗", "呢", "吧"].forEach(function (p) {
    const i = Z.indexOf(p);
    if (i > -1 && i !== n - 1) add("error", p + " goes at the very end of the sentence.", edit(function (c) { c.splice(i, 1); c.push(p); }));
  });
  if (Z.filter(function (z) { return z === "吗"; }).length > 1) add("error", "Use 吗 only once, at the end.");
  if (Z[0] === "了") add("error", "了 can't start a sentence. It goes after the verb or at the end: 我买了, 太冷了.");
  if (Z[0] === "的") add("error", "的 links two things (我的书, my book), so it can't start a sentence.");

  // 和
  Z.forEach(function (z, i) {
    if (z !== "和") return;
    if (i === 0 || i === n - 1) add("error", "和 means 'and' between two nouns, so it needs something on both sides: 我和你.");
    else if (["V", "A"].indexOf(T(i - 1)) > -1 || ["V", "A"].indexOf(T(i + 1)) > -1)
      add("error", "和 only joins nouns, like 我和你 or 茶和水. To join two actions or describing words, use 也 or just put them side by side.");
  });

  // Questions
  const qw = toks.filter(function (t) { return t.t === "Q"; })[0];
  if (qw && Z.indexOf("吗") > -1) add("error", "This already has a question word (" + qw.zh + "), so it's a question without 吗. Remove 吗.", edit(function (c) { c.splice(c.indexOf("吗"), 1); }));
  for (let i = 0; i < n - 2; i++) {
    if (Z[i + 1] === "不" && Z[i] === Z[i + 2] && Z.indexOf("吗") > -1)
      add("error", Z[i] + "不" + Z[i] + " already asks a question. Remove 吗.", edit(function (c) { c.splice(c.indexOf("吗"), 1); }));
  }

  // 不 and 没
  for (let i = 0; i < n - 1; i++) {
    if (Z[i] === "不" && Z[i + 1] === "有") add("error", "有 always uses 没 for 'not': say 没有, never 不有.", edit(function (c) { c[i] = "没"; }));
    if (Z[i] === "没" && Z[i + 1] === "是") add("error", "没 doesn't go with 是. Use 不是.", edit(function (c) { c[i] = "不"; }));
    if (Z[i] === "没" && (Z[i + 1] === "会" || Z[i + 1] === "能")) add("error", "Use 不 with " + Z[i + 1] + ": 不" + Z[i + 1] + ".", edit(function (c) { c[i] = "不"; }));
    if (Z[i] === "没" && T(i + 1) === "A") add("warn", "To say something isn't " + toks[i + 1].en + ", use 不: 不" + Z[i + 1] + ".", edit(function (c) { c[i] = "不"; }));
    if (Z[i] === "是" && Z[i + 1] === "不" && Z[i + 2] !== "是") add("error", "不 goes before the verb: 不是, not 是不.", edit(function (c) { c[i] = "不"; c[i + 1] = "是"; }));
  }

  // 二 and 两
  for (let i = 0; i < n; i++) {
    if (Z[i] === "二" && (T(i + 1) === "M" || Z[i + 1] === "点") && T(i - 1) !== "NUM")
      add("error", Z[i + 1] === "点" ? "For 2 o'clock say 两点, not 二点." : "Before a measure word, 2 is 两 (liǎng): 两" + Z[i + 1] + ".", edit(function (c) { c[i] = "两"; }));
    if (Z[i] === "两" && T(i + 1) !== "M" && T(i + 1) !== "U")
      add("warn", "两 is for 2 before a measure word, like 两个人. When counting or in bigger numbers, use 二: 二十.");
  }

  // Number + thing needs a measure word
  for (let i = 0; i < n - 1; i++) {
    if (numLike(i) && !numLike(i + 1) && (T(i + 1) === "N" || T(i + 1) === "P")) {
      const m = measureFor(toks[i + 1]);
      const numWord = Z[i] === "二" && T(i - 1) !== "NUM" ? "两" : Z[i];
      add("error", "Put a measure word between a number and a thing: " + numWord + m + Z[i + 1] + ". For " + Z[i + 1] + " use " + m + ".",
        edit(function (c) { c[i] = numWord; c.splice(i + 1, 0, m); }));
    }
    if (T(i) === "DEM" && (T(i + 1) === "N" || (T(i + 1) === "P" && toks[i + 1].s !== "pron"))) {
      const m = measureFor(toks[i + 1]);
      add("warn", "After 这 or 那, a measure word usually comes before the thing: " + Z[i] + m + Z[i + 1] + ".", edit(function (c) { c.splice(i + 1, 0, m); }));
    }
  }
  // Measure words: need a number before, and must suit the thing
  for (let i = 0; i < n; i++) {
    if (T(i) !== "M") continue;
    if (!(numLike(i - 1) || T(i - 1) === "DEM" || Z[i - 1] === "哪"))
      add("warn", "A measure word needs a number or 这/那 in front: 一" + Z[i] + ", 这" + Z[i] + ".");
    const next = toks[i + 1];
    if (!next || (next.t !== "N" && next.t !== "P")) continue;
    const want = measureFor(next);
    const okPair = Z[i] === want || (Z[i] === "口" && next.zh === "人") || (Z[i] === "个" && want === "杯");
    if (!okPair) {
      const lvl = next.s === "money" ? "error" : "warn";
      add(lvl, (MEASURE_NOTE[Z[i]] ? Z[i] + " is for " + MEASURE_NOTE[Z[i]] + ". " : "") + "For " + next.zh + " the measure word is " + want + ".", edit(function (c) { c[i] = want; if (c[i - 1] === "二" && T(i - 2) !== "NUM") c[i - 1] = "两"; }));
    }
  }

  // Every sentence needs something to say about the subject
  const hasPred = toks.some(function (t) { return t.t === "V" || t.t === "A" || t.t === "U"; }) ||
    (Z.indexOf("多少") > -1 && Z.indexOf("钱") > -1) || Z.indexOf("怎么样") > -1;
  if (!hasPred) add("error", "Every sentence needs a verb (like 是, 有, 去) or a describing word (like 好, 冷). This one doesn't have one yet.");

  // 是 with a describing word
  for (let i = 0; i < n; i++) {
    if (Z[i] !== "是") continue;
    let j = i + 1;
    while (j < n && ADV_STOP.indexOf(Z[j]) > -1) j++;
    if (T(j) === "A" && (j === n - 1 || T(j + 1) === "PT")) {
      add("error", "Don't use 是 with describing words. In Chinese the describing word does the job of the verb: 她很漂亮, not 她是漂亮.",
        edit(function (c) { if (j === i + 1) c[i] = "很"; else c.splice(i, 1); }));
    }
  }
  // A describing word on its own at the end
  const joined = Z.join("");
  if (joined !== "你好" && joined !== "您好") {
    for (let i = 1; i < n; i++) {
      if (T(i) === "A" && i === n - 1 && ["P", "N", "L", "T", "DEM"].indexOf(T(i - 1)) > -1)
        add("warn", "Describing words usually take 很 (or 太…了, 真, 非常) in front: " + Z.slice(0, i).join("") + "很" + Z[i] + ". Without it, it sounds like you're comparing.",
          edit(function (c) { c.splice(i, 0, "很"); }));
    }
  }

  // 很 and 太
  for (let i = 0; i < n; i++) {
    if (Z[i] !== "很") continue;
    const nx = toks[i + 1];
    if (!nx || nx.t === "PT") add("error", "很 needs a describing word after it: 很好, 很忙.");
    else if (nx.t === "V" && nx.s.indexOf("feel") === -1) add("error", "很 goes before describing words (很好) and feeling verbs (很喜欢), not action verbs like " + nx.zh + ".");
    else if (["A", "V", "D"].indexOf(nx.t) === -1) add("error", "很 needs a describing word after it, like 很好 or 很忙.");
  }
  if (Z.indexOf("太") > -1 && T(Z.indexOf("太") + 1) === "A" && Z.indexOf("了") === -1)
    add("info", "太 usually comes with 了 at the end: 太冷了! (It's too cold!)");

  // Adverbs (也, 都, 不, 很 ...) come after the subject and before the verb
  for (let i = 0; i < n; i++) {
    if (T(i) !== "D") continue;
    const nx = toks[i + 1];
    if (!nx || nx.t === "PT") {
      if (Z[i] === "很") continue; // covered by the 很 rule above
      const fv = toks.findIndex(function (t) { return t.t === "V" || t.t === "A"; });
      add("error", Z[i] + " must come before a verb or describing word, for example 我也去, 他不忙.",
        fv > -1 && fv < i ? edit(function (c) { c.splice(i, 1); c.splice(fv, 0, Z[i]); }) : null);
      continue;
    }
    if (i === 0 && (nx.t === "P" || nx.t === "N") && Z[i] !== "不") {
      add("error", Z[i] + " goes after the person or thing and before the verb: " + Z[1] + Z[0] + "…, not " + Z[0] + Z[1] + "….",
        edit(function (c) { c.splice(0, 1); c.splice(1, 0, Z[0]); }));
    }
    if (nx.t === "T") add("error", "Time words come before " + Z[i] + ": 今天不去, not 不今天去.", edit(function (c) { c[i] = Z[i + 1]; c[i + 1] = Z[i]; }));
  }
  for (let i = 0; i < n - 1; i++) {
    const pair = Z[i] + Z[i + 1];
    if (pair === "不也") add("error", "Say 也不, not 不也.", edit(function (c) { c[i] = "也"; c[i + 1] = "不"; }));
    if (pair === "都也") add("error", "Say 也都, not 都也.", edit(function (c) { c[i] = "也"; c[i + 1] = "都"; }));
    if (pair === "不都") add("info", "不都 means 'not all of them'. For 'none of them', say 都不.");
    if (pair === "不很") add("info", "不很 is rare. To say 'not very', use 不太: 不太好.");
  }

  // Word order around the main verb
  const v = toks.findIndex(function (t) { return t.t === "V"; });
  let subjEnd = 0;
  while (subjEnd < n && ["P", "N", "DE", "DEM", "C"].indexOf(T(subjEnd)) > -1) subjEnd++;
  if (v > -1) {
    // Time words go before the verb
    for (let j = v + 1; j < n; j++) {
      if (T(j) === "T" && toks[v].s !== "cop")
        add("error", Z[j] + " is a time word, and time words go before the verb in Chinese: " +
          Z.slice(0, subjEnd).join("") + Z[j] + "…", edit(function (c) { const t = c.splice(j, 1)[0]; c.splice(Math.min(subjEnd, j), 0, t); }));
    }
    // Where something happens goes before the action
    toks.forEach(function (t, k) {
      if (t.t !== "V" || ["loc", "pos", "motion", "cop", "have"].indexOf(t.s) > -1) return;
      for (let m = k + 1; m < n - 1; m++) {
        if (Z[m] === "在" && T(m + 1) === "L") {
          let ins = k; while (ins > 0 && T(ins - 1) === "D") ins--;
          add("error", "Where something happens goes before the action: 在 + place + verb. Say 我在家看书, not 我看书在家.",
            edit(function (c) { const place = c.splice(m, 2); c.splice.apply(c, [ins, 0].concat(place)); }));
        }
      }
    });
  }
  for (let i = 0; i < n - 2; i++) {
    if (T(i) === "P" && T(i + 1) === "L" && T(i + 2) === "V" && ["motion", "have", "loc", "cop"].indexOf(toks[i + 2].s) === -1)
      add("warn", "To say where you do something, put 在 before the place: " + Z[i] + "在" + Z[i + 1] + Z[i + 2] + ".", edit(function (c) { c.splice(i + 1, 0, "在"); }));
  }
  for (let i = 0; i < n - 1; i++) {
    if (T(i) === "V" && toks[i].s === "motion" && Z[i + 1] === "在")
      add("error", Z[i] + " doesn't need 在 before a place: 我" + Z[i] + "学校, not 我" + Z[i] + "在学校.", edit(function (c) { c.splice(i + 1, 1); }));
    if ((Z[i] === "会" || Z[i] === "能") && ["N", "L", "P"].indexOf(T(i + 1)) > -1)
      add("warn", Z[i] + " usually needs an action after it: 我" + Z[i] + "说汉语, 我" + Z[i] + "开车.");
  }
  // Thing before the verb
  for (let i = 1; i < n - 1; i++) {
    if (T(i - 1) === "P" && T(i) === "N" && T(i + 1) === "V" && toks[i + 1].s === "trans" && i + 1 === n - 1)
      add("error", "In Chinese the thing comes after the verb, as in English: " + Z[i - 1] + Z[i + 1] + Z[i] + ", not " + Z[i - 1] + Z[i] + Z[i + 1] + ".",
        edit(function (c) { c[i] = Z[i + 1]; c[i + 1] = Z[i]; }));
  }
  // No subject: fine for commands, but worth knowing
  if (T(0) === "V" && Z[n - 1] !== "吧") add("info", "There's no 'who' at the start. That's fine for commands, or when it's obvious, but a full sentence usually starts with who: 我" + joined + ".");

  // Keep one copy of each message
  const seen = {};
  return out.filter(function (x) { if (seen[x.msg]) return false; seen[x.msg] = true; return true; });
}

let builderMode = "free";
let buildGroup = 0;
let built = [];          // words in the sentence; in challenges also the tile index
let chIndex = 0, chTiles = [], chTries = 0;
function renderBuilder() {
  app.appendChild(el("p", { class: "sub", text: "Tap words to build a sentence, then check it. If something doesn't fit, it tells you why and suggests a fix. Tap a word in your sentence to take it out." }));
  const seg = el("div", { class: "seg" });
  [["free", "Build anything"], ["challenge", "Challenges"]].forEach(function (m) {
    seg.appendChild(el("button", { class: builderMode === m[0] ? "on" : "", text: m[1], onclick: function () { builderMode = m[0]; built = []; if (m[0] === "challenge") startChallenge(chIndex); renderBasics(); } }));
  });
  app.appendChild(seg);
  const host = el("div", { id: "builder" });
  app.appendChild(host);
  if (builderMode === "challenge" && !chTiles.length) startChallenge(chIndex);
  drawBuilder();
  app.appendChild(el("p", { class: "note", style: "margin-top:16px", text: "The checker knows the common beginner rules: word order, 不 and 没, measure words, 是, 很, 吗 and more. It can't catch every mistake, so 'Looks good' means no common mistakes were found." }));
}
function startChallenge(i) {
  chIndex = (i + CHALLENGES.length) % CHALLENGES.length;
  const c = CHALLENGES[chIndex];
  chTiles = shuffle(c[1][0].split(" ").concat(c[2].split(" ")));
  built = []; chTries = 0;
}
function builtToks() { return built.map(function (b) { return tok(b.z); }); }
function tileEl(t, onclick, used) {
  return el("button", { class: "tile" + (used ? " used" : ""), "aria-label": t.zh + " " + t.en, onclick: onclick }, [
    el("span", { class: "zh hz", text: t.zh }), el("span", { class: "py", text: t.py })
  ]);
}
function drawBuilder(verdict) {
  const host = document.getElementById("builder");
  if (!host) return;
  host.innerHTML = "";
  const isCh = builderMode === "challenge";
  if (isCh) {
    host.appendChild(el("div", { class: "progress" }, [el("span", { text: "Challenge " + (chIndex + 1) + " of " + CHALLENGES.length }), el("span", { text: "" })]));
    host.appendChild(el("div", { class: "card", style: "min-height:0;padding:14px;margin-bottom:10px" }, [
      el("div", { class: "note", style: "margin-top:0", text: "Say this in Chinese" }),
      el("div", { class: "prompt-en", text: CHALLENGES[chIndex][0] })
    ]));
  }
  // The sentence so far
  const line = el("div", { class: "build-line", "aria-label": "Your sentence" });
  if (!built.length) line.appendChild(el("div", { class: "empty", text: "Your sentence appears here" }));
  built.forEach(function (b, i) {
    line.appendChild(tileEl(tok(b.z), function () { built.splice(i, 1); drawBuilder(); }));
  });
  host.appendChild(line);
  const toks = builtToks();
  if (toks.length) {
    host.appendChild(el("div", { class: "gloss", style: "text-align:center", text: toks.map(function (t) { return t.py; }).join(" ") }));
  }
  host.appendChild(el("div", { class: "row" }, [
    el("button", { class: "btn", text: "Undo", disabled: built.length ? null : "disabled", onclick: function () { built.pop(); drawBuilder(); } }),
    el("button", { class: "btn", text: "Clear", disabled: built.length ? null : "disabled", onclick: function () { built = []; drawBuilder(); } }),
    el("button", { class: "btn", text: "🔊", "aria-label": "Hear it", disabled: built.length ? null : "disabled", onclick: function () { speak(toks.map(function (t) { return t.zh; }).join("")); } }),
    el("button", { class: "btn primary", text: "Check", disabled: built.length ? null : "disabled", onclick: function () { drawBuilder(true); } })
  ]));
  if (verdict) host.appendChild(isCh ? challengeVerdict(toks) : freeVerdict(toks));

  // Word tiles
  if (isCh) {
    const bank = el("div", { class: "bank", style: "justify-content:center" });
    chTiles.forEach(function (z, i) {
      const used = built.some(function (b) { return b.i === i; });
      bank.appendChild(tileEl(tok(z), function () { if (!used) { built.push({ z: z, i: i }); drawBuilder(); } }, used));
    });
    host.appendChild(bank);
    host.appendChild(el("div", { class: "row" }, [
      el("button", { class: "btn", text: "‹ Previous", onclick: function () { startChallenge(chIndex - 1); drawBuilder(); } }),
      el("button", { class: "btn", text: "Next ›", onclick: function () { startChallenge(chIndex + 1); drawBuilder(); } })
    ]));
  } else {
    const cats = el("div", { class: "cat-row" });
    BUILD_GROUPS.forEach(function (g, i) {
      cats.appendChild(el("button", { class: i === buildGroup ? "on" : "", text: g.name, onclick: function () { buildGroup = i; drawBuilder(); } }));
    });
    host.appendChild(cats);
    const bank = el("div", { class: "bank" });
    BUILD_GROUPS[buildGroup].w.forEach(function (w) {
      bank.appendChild(tileEl(tok(w[0]), function () { built.push({ z: w[0] }); speak(w[0]); drawBuilder(); }));
    });
    if (BUILD_GROUPS[buildGroup].name === "People") {
      if (S.myName && tok(S.myName)) bank.appendChild(tileEl(tok(S.myName), function () { built.push({ z: S.myName }); drawBuilder(); }));
      const nameIn = el("input", { id: "my-name", type: "text", maxlength: "16", placeholder: "Your name", "aria-label": "Your name", value: S.myName || "" });
      const setName = function () { const v = nameIn.value.trim(); if (v) { S.myName = v.slice(0, 16); registerMyName(); save(true); drawBuilder(); } };
      nameIn.addEventListener("keydown", function (e) { if (e.key === "Enter") setName(); });
      bank.appendChild(el("div", { class: "try", style: "width:100%;margin-top:4px" }, [nameIn, el("button", { class: "btn", style: "flex:none;padding:10px 14px", text: S.myName ? "Change my name" : "Add my name", onclick: setName })]));
    }
    host.appendChild(bank);
  }
}
function issueList(issues) {
  const box = el("div");
  issues.forEach(function (x) {
    const label = { error: "Doesn't fit", warn: "Check", info: "Tip" }[x.lvl];
    const row = el("div", { class: "issue" }, [el("span", { class: "lvl " + x.lvl, text: label }), document.createTextNode(x.msg)]);
    if (x.fix && x.fix.every(Boolean)) {
      const fz = x.fix.map(function (t) { return t.zh; }).join("");
      row.appendChild(el("div", { class: "fix" }, [
        "Try: ", el("span", { class: "hz", text: fz }), " ",
        el("button", { class: "linkbtn", style: "display:inline;margin:0 0 0 6px", text: "Use this", onclick: function () {
          built = x.fix.map(function (t) { return { z: t.zh }; });
          if (builderMode === "challenge") {
            const free = chTiles.map(function (z, i) { return { z: z, i: i }; });
            built = built.map(function (b) { const k = free.findIndex(function (f) { return f.z === b.z; }); return k > -1 ? free.splice(k, 1)[0] : b; });
          }
          drawBuilder(true);
        } })
      ]));
    }
    box.appendChild(row);
  });
  return box;
}
function freeVerdict(toks) {
  const issues = checkSentence(toks);
  const errors = issues.filter(function (x) { return x.lvl === "error"; }).length;
  const warns = issues.filter(function (x) { return x.lvl === "warn"; }).length;
  const zh = toks.map(function (t) { return t.zh; }).join("");
  const cls = errors ? "bad" : warns ? "warn" : "good";
  const title = errors ? "Doesn't fit yet" : warns ? "Nearly there" : "Looks good";
  const box = el("div", { class: "verdict " + cls, role: "status" }, [el("h3", { text: title })]);
  if (!errors && !warns) {
    box.appendChild(el("div", { class: "hz", style: "font-size:22px", text: zh }));
    box.appendChild(el("div", { class: "gloss", text: "Word by word: " + toks.map(function (t) { return t.en; }).join(" · ") }));
    speak(zh);
  }
  box.appendChild(issueList(issues));
  return box;
}
function challengeVerdict(toks) {
  const c = CHALLENGES[chIndex];
  const zh = toks.map(function (t) { return t.zh; }).join("");
  const answers = c[1].map(function (a) { return a.replace(/ /g, ""); });
  chTries++;
  if (answers.indexOf(zh) > -1) {
    speak(zh);
    return el("div", { class: "verdict good", role: "status" }, [
      el("h3", { text: "Correct!" }),
      el("div", { class: "hz", style: "font-size:22px", text: zh }),
      el("div", { class: "gloss", text: toks.map(function (t) { return t.py; }).join(" ") }),
      el("div", { class: "row" }, [el("button", { class: "btn primary", text: "Next challenge", onclick: function () { startChallenge(chIndex + 1); drawBuilder(); } })])
    ]);
  }
  const issues = checkSentence(toks);
  const box = el("div", { class: "verdict bad", role: "status" }, [el("h3", { text: "Not quite" })]);
  if (issues.some(function (x) { return x.lvl !== "info"; })) box.appendChild(issueList(issues));
  else box.appendChild(el("div", { text: "That's a possible sentence, but it doesn't say \"" + c[0] + "\" yet. Word by word you've said: " + toks.map(function (t) { return t.en; }).join(" · ") + "." }));
  if (chTries >= 2) {
    box.appendChild(el("div", { class: "fix", style: "margin-top:8px" }, ["Answer: ", el("span", { class: "hz", style: "font-size:20px", text: answers[0] }), " (" + c[1][0].split(" ").map(function (z) { return tok(z).py; }).join(" ") + ")"]));
  } else {
    box.appendChild(el("div", { class: "note", text: "Have another go. The answer appears after two tries." }));
  }
  return box;
}

Object.keys(NOTES).forEach(function (k) {
  const n = NOTES[k];
  (n.s || []).forEach(function (x) { ALL_SENTENCES.push({ lesson: Number(k), s: x }); });
  (n.g || []).forEach(function (g) { g.ex.forEach(function (x) { if (/[。！？]$/.test(x[0])) ALL_SENTENCES.push({ lesson: Number(k), s: x }); }); });

// A model sentence that uses a word, preferring its own lesson, then earlier ones
function sentenceFor(w) {
  if (w.name) return null;
  // Longer words that contain this one (今天 contains 天), so 天 isn't matched inside 今天
  const longer = WORDS.filter(function (x) { return x.h.length > w.h.length && x.h.indexOf(w.h) > -1; }).map(function (x) { return x.h; });
  function uses(text) {
    longer.forEach(function (l) { text = text.split(l).join("　"); });
    return text.indexOf(w.h) > -1;
  }
  const mine = ALL_SENTENCES.filter(function (x) { return uses(x.s[0]); });
  const pick = mine.filter(function (x) { return x.lesson === w.lesson; })[0] ||
    mine.filter(function (x) { return x.lesson <= w.lesson; }).pop() || mine[0];
  return pick ? pick.s : null;
}

  ]);
