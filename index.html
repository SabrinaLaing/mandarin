function hasGuide(n) { return !!(GUIDE[n] || NOTES[n]); }
// One lesson's guide: goal, dialogue, grammar, watch out, word tables, culture, sentences
function renderNotes(n) {
  clear();
  const L = LESSONS[n - 1], N = NOTES[n] || {}, G = GUIDE[n] || {};
  const hide = hidePinyin(n);
  app.appendChild(el("button", { class: "back", text: "‹ " + L.label, onclick: function () { renderLesson(n); } }));
  app.appendChild(el("h1", { text: "Lesson guide" }));
  app.appendChild(el("p", { class: "sub", text: L.label + ": " + L.en + ". Tap any Chinese to hear it, or 🐢 to hear it slowly." }));
  if (G.goal) app.appendChild(el("div", { class: "banner" }, [el("b", { text: "🎯 Goal: " }), G.goal]));

  // Dialogue with role-play
  if (G.dlg) {
    const card = el("div", { class: "type-card" }, [el("h3", { text: "Dialogue" })]);
    G.dlg.forEach(function (d) {
      card.appendChild(el("div", { class: "who", text: G.who[d[0]] }));
      card.appendChild(sentenceBlock([d[1], d[2], d[3]], hide));
    });
    const all = G.dlg.map(function (d) { return [d[1], "zh-CN"]; });
    card.appendChild(el("div", { class: "row" }, [
      el("button", { class: "btn", text: "▶ Play it all", onclick: function () { sayInOrder(all); } }),
      el("button", { class: "btn primary", text: "🎭 Role-play", onclick: function () { renderRolePlay(n, 1, 0, false); } })
    ]));
    card.appendChild(el("p", { class: "note", style: "margin:8px 0 0", text: "In role-play the app speaks " + G.who[0] + "'s lines and you say " + G.who[1] + "'s." }));
    app.appendChild(card);
  }

  // Grammar
  (N.g || []).forEach(function (g, i) {
    const card = el("div", { class: "type-card" }, [el("h3", { text: "Grammar " + (i + 1) + ": " + g.t }), el("p", { text: g.d })]);
    g.ex.forEach(function (x) { card.appendChild(sentenceBlock(x, hide)); });
    app.appendChild(card);
  });

  // Watch out: pairs that are easy to mix up
  if (G.watch) {
    const card = el("div", { class: "type-card" }, [el("h3", { text: "⚠️ Watch out" })]);
    G.watch.forEach(function (wo) {
      const row = el("div", { class: "pair" });
      wo.items.forEach(function (it) {
        row.appendChild(el("button", { class: "pair-item", onclick: function () { speak(it[3] || it[0]); } }, [
          el("span", { class: "zh hz", text: it[0] }), el("span", { class: "py", text: it[1] }), el("span", { class: "e", text: it[2] })
        ]));
      });
      card.appendChild(row);
      card.appendChild(el("p", { style: "margin:4px 0 12px", text: wo.tip }));
    });
    const host = el("div");
    card.appendChild(el("button", { class: "btn", style: "width:100%", text: "Test yourself", onclick: function () { watchQuestion(host, G.watch, { right: 0, total: 0 }); } }));
    card.appendChild(host);
    app.appendChild(card);
  }

  // Word tables
  if (G.table) {
    const tb = el("table");
    G.table.rows.forEach(function (r) {
      tb.appendChild(el("tr", { onclick: function () { speak(r[0].replace(/\s+/g, "")); } }, [
        el("td", { class: "zh hz", text: r[0] }), el("td", { class: "py", text: r[1] }), el("td", { class: "e", text: r[2] })
      ]));
    });
    app.appendChild(el("div", { class: "cheat" }, [el("h3", { text: G.table.t }), tb]));
  }
  if (G.grid) {
    const tb = el("table", { class: "grid" });
    tb.appendChild(el("tr", {}, G.grid.head.map(function (h) { return el("th", { text: h }); })));
    G.grid.rows.forEach(function (r) {
      tb.appendChild(el("tr", {}, r.map(function (c, k) {
        const zh = (c.match(/^[一-鿿…]+/) || [""])[0].replace("…", "");
        return el("td", { class: k === 0 ? "e" : "zh hz", text: c, onclick: zh ? function () { speak(zh); } : null });
      })));
    });
    app.appendChild(el("div", { class: "cheat" }, [el("h3", { text: G.grid.t }), tb]));
  }

  if (G.culture) app.appendChild(el("div", { class: "type-card culture" }, [el("h3", { text: "🏮 Good to know" }), el("p", { text: G.culture })]));

  if (N.s) {
    const card = el("div", { class: "type-card" }, [el("h3", { text: "Model sentences" })]);
    N.s.forEach(function (x) { card.appendChild(sentenceBlock(x, hide)); });
    app.appendChild(card);
  }
  const links = [el("button", { class: "btn primary", text: "Back to the lesson", onclick: function () { renderLesson(n); } })];
  if (G.link) links.unshift(el("button", { class: "btn", text: G.link[1], onclick: function () { basicsMode = G.link[0]; openTab("basics"); } }));
  app.appendChild(el("div", { class: "row" }, links));
}

// Watch-out quiz: hear one word or phrase, pick its meaning
function watchQuestion(host, groups, score) {
  host.innerHTML = "";
  const g = groups[Math.floor(Math.random() * groups.length)];
  const it = g.items[Math.floor(Math.random() * g.items.length)];
  host.appendChild(el("div", { class: "card", style: "min-height:0;padding:14px;margin-top:10px" }, [
    el("div", { class: "hz", style: "font-size:30px", text: it[0] }),
    el("div", { class: "mid-py", text: it[1] }),
    el("div", { class: "note", text: "What does this mean?" }),
    listenBtn(it[3] || it[0])
  ]));
  const opts = shuffle(g.items);
  const grid = el("div", { class: "opts" });
  const fb = el("div", { class: "feedback", role: "status" });
  let done = false;
  opts.forEach(function (o) {
    const b = el("button", { class: "opt", text: o[2] });
    b.addEventListener("click", function () {
      if (done) return; done = true;
      score.total++; const ok = o === it; if (ok) score.right++;
      grid.children[opts.indexOf(it)].classList.add("right");
      if (!ok) b.classList.add("wrong");
      fb.textContent = (ok ? "Correct. " : "Not quite. ") + g.tip + " Score " + score.right + " of " + score.total;
      fb.style.color = ok ? "var(--good)" : "var(--bad)";
    });
    grid.appendChild(b);
  });
  host.appendChild(grid);
  host.appendChild(fb);
  host.appendChild(el("div", { class: "row" }, [el("button", { class: "btn primary", text: "Next", onclick: function () { watchQuestion(host, groups, score); } })]));
  speak(it[3] || it[0]);
}

// Role-play: the app says the other person's lines, you say yours, then check
function renderRolePlay(n, me, i, shown) {
  clear();
  const G = GUIDE[n], d = G.dlg;
  app.appendChild(el("button", { class: "back", text: "‹ Lesson guide", onclick: function () { renderNotes(n); } }));
  app.appendChild(el("div", { class: "seg" }, [0, 1].map(function (k) {
    return el("button", { class: me === k ? "on" : "", text: "I'm " + G.who[k], onclick: function () { renderRolePlay(n, k, 0, false); } });
  })));
  if (i >= d.length) {
    app.appendChild(el("div", { class: "card" }, [el("div", { class: "big-py", text: "Well done!" }), el("div", { class: "en", text: "You finished the dialogue. Try it again as " + G.who[1 - me] + "." })]));
    app.appendChild(el("div", { class: "row" }, [
      el("button", { class: "btn", text: "Again", onclick: function () { renderRolePlay(n, me, 0, false); } }),
      el("button", { class: "btn primary", text: "Swap roles", onclick: function () { renderRolePlay(n, 1 - me, 0, false); } })
    ]));
    return;
  }
  app.appendChild(el("div", { class: "progress" }, [el("span", { text: "Role-play" }), el("span", { text: "Line " + (i + 1) + " of " + d.length })]));
  // The conversation so far
  d.slice(0, i).forEach(function (x) {
    app.appendChild(el("div", { class: "bubble" + (x[0] === me ? " mine" : "") }, [el("div", { class: "who", text: G.who[x[0]] }), el("div", { class: "hz", text: x[1] })]));
  });
  const line = d[i];
  if (line[0] !== me) {
    app.appendChild(el("div", { class: "bubble" }, [el("div", { class: "who", text: G.who[line[0]] }), el("div", { class: "hz", style: "font-size:22px", text: line[1] }),
      el("div", { class: "py", text: line[2] }), el("div", { class: "e", text: line[3] }), listenBtn(line[1])]));
    app.appendChild(el("div", { class: "row" }, [el("button", { class: "btn primary", text: "Next", onclick: function () { renderRolePlay(n, me, i + 1, false); } })]));
    speak(line[1]);
  } else if (!shown) {
    app.appendChild(el("div", { class: "bubble mine" }, [el("div", { class: "who", text: "You (" + G.who[me] + ")" }),
      el("div", { class: "en", style: "margin:0", text: "Say: " + line[3] }), el("div", { class: "note", text: "Say it out loud in Chinese, then check." })]));
    app.appendChild(el("div", { class: "row" }, [el("button", { class: "btn primary", text: "Check my answer", onclick: function () { renderRolePlay(n, me, i, true); } })]));
  } else {
    app.appendChild(el("div", { class: "bubble mine" }, [el("div", { class: "who", text: "You (" + G.who[me] + ")" }), el("div", { class: "hz", style: "font-size:22px", text: line[1] }),
      el("div", { class: "py", text: line[2] }), el("div", { class: "e", text: line[3] }), listenBtn(line[1])]));
    app.appendChild(el("div", { class: "row" }, [el("button", { class: "btn primary", text: "Next", onclick: function () { renderRolePlay(n, me, i + 1, false); } })]));
    speak(line[1]);
  }
}

// End-of-part test: 20 mixed questions from every lesson in the part
function startPartTest(pi) {
  const part = COURSE[pi];
  const seen = {};
  const pool = WORDS.filter(function (w) {
    if (w.name || !part.has(LESSONS[w.lesson - 1])) return false;
    const k = wkey(w.id); if (seen[k]) return false; seen[k] = true; return true;
  });
  const qs = shuffle(pool).sort(function (a, b) { return wstat(a.id).box - wstat(b.id).box; }).slice(0, 30);
  runPartTest(pi, shuffle(qs).slice(0, 20), 0, 0);
}
function runPartTest(pi, qs, i, right) {
  clear();
  const part = COURSE[pi];
  if (i >= qs.length) {
    const pct = Math.round(100 * right / qs.length);
    S.partTests = S.partTests || {};
    S.partTests[pi] = Math.max(S.partTests[pi] || 0, pct);
    noteStudyDay(); save();
    app.appendChild(el("button", { class: "back", text: "‹ All lessons", onclick: renderLessons }));
    app.appendChild(el("h1", { text: "Part " + (pi + 1) + " test: " + pct + "%" }));
    app.appendChild(el("p", { class: "sub", text: right + " of " + qs.length + " correct. " + (pct >= PASS ? "Well done, you've got a solid grip on " + part.name + "." : "Words you missed will come back in your lessons and flashcards.") }));
    app.appendChild(el("div", { class: "row" }, [
      el("button", { class: "btn", text: "Try again", onclick: function () { startPartTest(pi); } }),
      el("button", { class: "btn primary", text: "Back to lessons", onclick: renderLessons })
    ]));
    return;
  }
  app.appendChild(el("button", { class: "back", text: "‹ All lessons", onclick: renderLessons }));
  app.appendChild(el("div", { class: "progress" }, [el("span", { text: "Part " + (pi + 1) + " test" }), el("span", { text: (i + 1) + " of " + qs.length })]));
  app.appendChild(el("div", { class: "track" }, [el("i", { style: "width:" + Math.round(100 * i / qs.length) + "%" })]));
  const w = qs[i];
  const type = ["chars", "listen", "sounds"][i % 3];
  let prompt, options, label, isAnswer;
  if (type === "chars") {
    prompt = el("div", { class: "card" }, [el("div", { class: "big-hz hz", text: w.h }), el("div", { class: "note", text: "What does this mean?" })]);
    options = shuffle([w].concat(distractors(w, 3, "meaning")));
    label = function (o) { return el("button", { class: "opt" }, [o.e]); };
    isAnswer = function (o) { return o.id === w.id; };
  } else if (type === "listen") {
    prompt = el("div", { class: "card" }, [listenBtn(w.h, true), el("div", { class: "note", text: "Choose the character you heard." })]);
    options = shuffle([w].concat(distractors(w, 3, "sound")));
    label = function (o) { return el("button", { class: "opt hzopt hz" }, [o.h]); };
    isAnswer = function (o) { return o.id === w.id; };
    speak(w.h);
  } else {
    prompt = el("div", { class: "card" }, [el("div", { class: "en", style: "margin-top:0", text: w.e }), listenBtn(w.h, true), el("div", { class: "note", text: "Which pinyin did you hear?" })]);
    options = shuffle([w.p].concat(toneVariants(w.p, 3, spokenForms(w))));
    label = function (o) { return el("button", { class: "opt pyopt" }, [o]); };
    isAnswer = function (o) { return o === w.p; };
    speak(w.h);
  }
  app.appendChild(prompt);
  const grid = el("div", { class: "opts" });
  const fb = el("div", { class: "feedback", role: "status" });
  const nextBtn = el("button", { class: "btn primary", text: "Next", disabled: "disabled" });
  let answered = false, ok = false;
  const buttons = options.map(function (o) {
    const b = label(o);
    b.addEventListener("click", function () {
      if (answered) return;
      answered = true; ok = isAnswer(o); mark(w, ok);
      buttons.forEach(function (bb, k) { if (isAnswer(options[k])) bb.classList.add("right"); });
      if (!ok) b.classList.add("wrong");
      fb.textContent = (ok ? "Correct. " : "Not quite. ") + w.h + "  " + w.p + "  " + w.e;
      fb.style.color = ok ? "var(--good)" : "var(--bad)";
      nextBtn.disabled = false;
    });
    grid.appendChild(b);
    return b;
  });
  nextBtn.addEventListener("click", function () { runPartTest(pi, qs, i + 1, right + (ok ? 1 : 0)); });
  app.appendChild(grid);
  app.appendChild(fb);
  app.appendChild(el("div", { class: "row" }, [nextBtn]));
}

// ---------- Splitting a sentence into the app's words ----------
const READ_DICT = {};
let READ_MAX = 1;
WORDS.forEach(function (w) { if (!READ_DICT[w.h]) READ_DICT[w.h] = w; READ_MAX = Math.max(READ_MAX, w.h.length); });
// 杯 (a cup of) is taught with 杯子 in Lesson 8 and used in the Builder
READ_DICT["杯"] = { h: "杯", p: "bēi", e: "a cup of, a glass of", lesson: 8 };
// Longest match first. Returns pieces: { t, w } for words, { t, punct } for punctuation, { t, unknown } otherwise
function segmentText(text) {
  const out = [];
  let i = 0;
  while (i < text.length) {
    const ch = text[i];
    if (!/[一-鿿]/.test(ch)) { out.push({ t: ch, punct: true }); i++; continue; }
    let hit = null;
    for (let len = Math.min(READ_MAX, text.length - i); len > 0; len--) {
      const piece = text.substr(i, len);
      if (READ_DICT[piece]) { hit = piece; break; }
    }
    if (hit) { out.push({ t: hit, w: READ_DICT[hit] }); i += hit.length; }
    else { out.push({ t: ch, unknown: true }); i++; }
  }
  return out;
}
// Every sentence in the app that uses only the app's words, tagged with the
// latest lesson whose words it needs
const READING = (function () {
  const seen = {}, list = [];
  function add(x) {
    // Full sentences only: at least 3 characters (skips replies like 好！)
    if (!x || seen[x[0]] || !/[。！？]$/.test(x[0]) || x[0].replace(/[^一-鿿]/g, "").length < 3) return;
    const parts = segmentText(x[0]);
    if (parts.some(function (p) { return p.unknown; })) return;
    seen[x[0]] = true;
    const level = parts.reduce(function (m, p) { return p.w ? Math.max(m, p.w.lesson) : m; }, 1);
    list.push({ zh: x[0], py: x[1], en: x[2], level: level, parts: parts });
  }
  Object.keys(NOTES).forEach(function (k) {
    (NOTES[k].g || []).forEach(function (g) { g.ex.forEach(add); });
    (NOTES[k].s || []).forEach(add);
  });
  Object.keys(GUIDE).forEach(function (k) { (GUIDE[k].dlg || []).forEach(function (d) { add([d[1], d[2], d[3]]); }); });
  POWER_VERBS.forEach(function (v) { v.s.forEach(add); });
  READ_EXTRA.forEach(add);
  return list.sort(function (a, b) { return a.level - b.level; });
})();

let readMode = "pinyin";   // "pinyin" or "advanced"
let readScope = null;      // "L<n>" for one lesson, "mine" (lessons started) or "all"
let readDeck = [], readAt = 0;
function lessonsReached() {
  let max = 1;
  LESSONS.forEach(function (L) { if (Object.keys(lstat(L.n).steps).length) max = Math.max(max, L.n); });
  return max;
}
function readCount(n) { return READING.filter(function (s) { return s.level === n; }).length; }
function readPool() {
  if (readScope === "all") return READING;
  if (/^L\d+$/.test(readScope)) { const n = Number(readScope.slice(1)); return READING.filter(function (s) { return s.level === n; }); }
  const top = lessonsReached();
  return READING.filter(function (s) { return s.level <= top; });
}
function renderRead() {
  clear();

// Pinyin for one character of a word, by splitting the word's pinyin into syllables
function charPinyin(w, k) {
  const syl = [];
  w.p.split(/[\s'’]+/).forEach(function (chunk) { splitSyllables(chunk.replace(/[^A-Za-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜüĀÁǍÀĒÉĚÈŌÓǑÒ]/g, "")).forEach(function (x) { if (x) syl.push(x); }); });
  if (syl.length === w.h.length) return syl[k].toLowerCase();
  // Words ending in 儿 (哪儿 nǎr): the 儿 joins the syllable before it
  if (w.h[w.h.length - 1] === "儿" && syl.length === w.h.length - 1) return k < syl.length ? syl[k].toLowerCase().replace(/r$/, "") : "r";
  return "";
}
// The panel under the sentence: the character, its word, and other words that use it
function showCharInfo(box, c, k, w) {
  box.innerHTML = "";
  const alone = READ_DICT[c];
  const py = alone ? alone.p : charPinyin(w, k);
  box.appendChild(el("div", { class: "ci-head" }, [
    el("span", { class: "ci-char hz", text: c }),
    el("span", { class: "ci-main" }, [
      el("div", { class: "ci-py", text: py }),
      el("div", { class: "ci-en", text: alone ? alone.e : "Not used as a word on its own in this course" })
    ]),
    el("button", { class: "slow-mini", "aria-label": "Hear " + c, text: "🔊", onclick: function () { speak(c); } })
  ]));
  if (w.h.length > 1) {
    box.appendChild(el("button", { class: "ci-word", onclick: function () { speak(w.h); } }, [
      el("span", { class: "note", style: "margin:0", text: "In this sentence: " }),
      el("span", { class: "hz", style: "font-size:18px", text: w.h }), "  " + w.p + "  " + w.e + "  🔊"
    ]));
  }
  const seen = {}; seen[w.h] = true; seen[c] = true;
  const also = WORDS.filter(function (x) { if (seen[x.h] || x.name || x.h.indexOf(c) === -1) return false; seen[x.h] = true; return true; }).slice(0, 5);
  if (also.length) box.appendChild(el("div", { class: "ci-also" }, ["Also in: "].concat(also.map(function (x, i) {
    return el("span", {}, [i ? " · " : "", el("span", { class: "hz", text: x.h }), " " + x.e]);
  }))));
}
function showSentence() {
  const host = document.getElementById("readhost");
  if (!host) return;
  host.innerHTML = "";
  if (!readDeck.length) { host.appendChild(el("p", { class: "sub", text: "No sentences yet. Start a lesson first." })); return; }
  const s = readDeck[readAt];
  let revealed = false;
  const card = el("div", { class: "card read-card" });
  const gloss = el("div", { class: "read-gloss", role: "status" }, [el("span", { class: "note", text: "Tap any character to see what it means" })]);
  function draw() {
    card.innerHTML = "";
    const line = el("div", { class: "read-line hz" });
    s.parts.forEach(function (p) {
      if (!p.w) { line.appendChild(el("span", { class: "read-punct", text: p.t })); return; }
      // Each word is underlined, and each character in it can be tapped
      const word = el("span", { class: "read-word" });
      p.t.split("").forEach(function (c, k) {
        word.appendChild(el("button", { class: "read-char", text: c, "aria-label": c, onclick: function () {
          line.querySelectorAll(".on").forEach(function (x) { x.classList.remove("on"); });
          word.classList.add("on"); this.classList.add("on");
          showCharInfo(gloss, c, k, p.w);
          speak(c);
        } }));
      });
      line.appendChild(word);
    });
    card.appendChild(line);
    if (readMode === "pinyin" || revealed) card.appendChild(el("div", { class: "read-py", text: s.py }));
    card.appendChild(gloss);
    if (revealed) card.appendChild(el("div", { class: "read-en", text: s.en }));
    card.appendChild(listenBtn(s.zh));
  }
  draw();
  host.appendChild(el("div", { class: "progress" }, [el("span", { text: "Sentence " + (readAt + 1) + " of " + readDeck.length }), el("span", { text: lessonLabel(s.level) })]));
  host.appendChild(card);
  const row = el("div", { class: "row" });
  const reveal = el("button", { class: "btn primary", text: readMode === "pinyin" ? "Reveal English" : "Reveal pinyin and English" });
  reveal.addEventListener("click", function () {
    revealed = true; draw(); speak(s.zh);
    row.innerHTML = "";
    row.appendChild(el("button", { class: "btn bad", text: "Not yet", onclick: function () {
      // See it again a few sentences later
      readDeck.splice(Math.min(readAt + 4, readDeck.length), 0, s); next();
    } }));
    row.appendChild(el("button", { class: "btn good", text: "I could read it", onclick: function () { S.readCount = (S.readCount || 0) + 1; noteStudyDay(); save(); next(); } }));
  });
  row.appendChild(reveal);
  host.appendChild(row);
  host.appendChild(el("p", { class: "note", style: "text-align:center", text: "Sentences read so far: " + (S.readCount || 0) }));
  function next() { readAt++; if (readAt >= readDeck.length) { readDeck = shuffle(readPool()); readAt = 0; } showSentence(); window.scrollTo(0, 0); }
}

    { h: "A little every day", p: "20 minutes a day works far better than two hours once a week, because memory is built by coming back to words over several days. The 🔥 streak on the Lessons page keeps count." },
    { h: "Characters are built from parts", p: "About 8 in 10 characters combine a meaning part and a sound part. Spotting these parts (Characters in the Basics tab) makes new characters much easier: 妈 is 女 (woman) plus 马 (mǎ, the sound).",
      ex: [["妈","mā","女 woman + 马 mǎ"]] },
    { h: "Read, listen, speak, write", p: "Use every tab: Lessons to learn, Cards to review, Read to practise reading, Tones to train your ear, Basics for the building blocks, and the tracing sheets PDF to practise handwriting." }] }
];
function introRead(i) { return !!(S.intro && S.intro[i]); }
function introRow(i) {
  const t = INTRO[i];
  return el("button", { class: "lesson", onclick: function () { renderIntro(i); } }, [
    el("span", { class: "num", text: "0." + (i + 1) }),
    el("span", { class: "t" }, [el("div", { class: "zh hz", text: t.zh }), el("div", { class: "en", text: t.title })]),
    introRead(i) ? el("div", { class: "seal", "aria-label": "Read" }, [el("b", { text: "读" }), "read"]) : el("div", { class: "seal empty" })
  ]);
}
function renderIntro(i) {
  clear();
  const t = INTRO[i];
  S.intro = S.intro || {}; S.intro[i] = true; save(true);
  app.appendChild(el("button", { class: "back", text: "‹ All lessons", onclick: renderLessons }));
  app.appendChild(el("div", { class: "progress" }, [el("span", { text: "Part 0: Before you start" }), el("span", { text: (i + 1) + " of " + INTRO.length })]));
  app.appendChild(el("h1", {}, [el("span", { class: "hz", text: t.zh + "  " }), t.title]));
  t.blocks.forEach(function (b) {
    const card = el("div", { class: "type-card" }, [el("h3", { text: b.h }), el("p", { style: "color:var(--ink);font-size:15px", text: b.p })]);
    (b.ex || []).forEach(function (x) { card.appendChild(sentenceBlock(x, false)); });
    app.appendChild(card);
  });
  app.appendChild(el("div", { class: "row" }, [
    el("button", { class: "btn", text: i ? "‹ Previous" : "All lessons", onclick: function () { if (i) renderIntro(i - 1); else renderLessons(); } }),
    el("button", { class: "btn primary", text: i < INTRO.length - 1 ? "Next ›" : "Start Lesson 1", onclick: function () { if (i < INTRO.length - 1) renderIntro(i + 1); else renderLesson(1); } })
  ]));
}

// Pages in "Character tracing sheets.pdf" where each lesson starts
const TRACE_PAGES = {"1": 2, "2": 3, "3": 3, "4": 5, "5": 6, "6": 9, "7": 10, "8": 11, "9": 13, "10": 14, "11": 16, "12": 17, "13": 18, "14": 19, "15": 21, "16": 22, "17": 24, "18": 24, "19": 25, "20": 26, "21": 27, "22": 28, "23": 29, "25": 30, "26": 32, "27": 34, "28": 36, "29": 39, "30": 40};
const TRACE_PDF = "tracing-sheets.pdf";
// On the Claude-hosted page, files are saved through Claude; everywhere else
// (this computer, the installed phone app) the PDF opens as a normal link
function inClaudePage() { return !!(window.claude && window.claude.use) || /claude/i.test(location.hostname); }
function traceLink(n, text) {
  if (!inClaudePage()) {
    return el("a", { class: "btn", style: "display:block;text-align:center;text-decoration:none;margin-top:8px", href: encodeURI(TRACE_PDF) + (n ? "#page=" + TRACE_PAGES[n] : ""), target: "_blank", rel: "noopener", text: text });
  }
  // Published page: save the PDF to the device (this lesson starts on page N)
  const b = el("button", { class: "btn", style: "display:block;width:100%;margin-top:8px", text: text.replace("(PDF)", "") + (n ? "(PDF, page " + TRACE_PAGES[n] + ")" : "(PDF)") });
  b.addEventListener("click", async function () {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (!dl) { b.textContent = "Saving files isn't available here"; return; }
    b.textContent = "Getting the PDF…";
    try {
      const r = await fetch("tracing-sheets.pdf");
      if (!r.ok) throw new Error("missing");
      await dl.save({ filename: TRACE_PDF, data: await r.blob() });
      b.textContent = "📄 Saved: " + TRACE_PDF + (n ? ", page " + TRACE_PAGES[n] : "");
    } catch (e) {
      b.textContent = e && e.code === "declined" ? text : "Couldn't save the PDF. Tap to try again";
    }
  });
  return b;
}

// =====================================================================
// NAVIGATION
// =====================================================================
const RENDER = { lessons: renderLessons, review: renderReview, read: renderRead, tones: renderTones, basics: renderBasics, words: renderWords };
document.getElementById("tabs").addEventListener("click", function (e) {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  openTab(b.getAttribute("data-tab"));
});
function openTab(tab) {
  currentTab = RENDER[tab] ? tab : "lessons";
  document.querySelectorAll("#tabs button").forEach(function (x) { x.classList.toggle("active", x.getAttribute("data-tab") === currentTab); });
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  S.last.tab = currentTab; save(true);
  RENDER[currentTab]();
}
openTab(S.last.tab || "lessons");
cloudStart();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
</script>
